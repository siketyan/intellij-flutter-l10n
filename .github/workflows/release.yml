name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # Opens or updates the release PR, and creates a tag and a draft GitHub Release once the PR is merged.
      # The release is kept as a draft until the assets are uploaded, since immutable releases may be enabled.
      - uses: googleapis/release-please-action@v5
        id: release

  publish:
    name: Publish
    needs:
      - release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    # Add protection rules (e.g. required reviewers) to this environment to approve each publication manually.
    environment: marketplace
    steps:
      # Free GitHub Actions Environment Disk Space
      - name: Maximize Build Space
        uses: jlumbroso/free-disk-space@v2.0.0
        with:
          tool-cache: false
          large-packages: false

      - name: Fetch Sources
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21

      - uses: gradle/actions/wrapper-validation@v6.4.1

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.1

      # The release PR is created with GITHUB_TOKEN, which does not trigger the Build workflow on it.
      # Run the tests here once more before publishing.
      - name: Run Tests
        run: ./gradlew check

      # Signing is optional: without the CERTIFICATE_CHAIN / PRIVATE_KEY secrets, signPlugin is skipped
      # and publishPlugin uploads the unsigned archive instead.
      - name: Publish to JetBrains Marketplace
        run: ./gradlew publishPlugin
        env:
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}

      - name: Upload plugin to GitHub Release
        shell: bash
        run: |
          shopt -s nullglob
          # Prefer the signed archive if signing is configured.
          files=(build/distributions/*-signed.zip)
          if [ ${#files[@]} -eq 0 ]; then
            files=(build/distributions/*.zip)
          fi
          gh release upload "$TAG_NAME" "${files[@]}"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}

      # Publishing makes the release immutable, so this must be the last step.
      - name: Publish GitHub Release
        run: gh release edit "$TAG_NAME" --draft=false
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
